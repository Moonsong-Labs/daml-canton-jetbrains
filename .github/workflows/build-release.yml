name: Build Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/test/webview/package-lock.json

      - name: Verify Script Results in Chromium
        working-directory: src/test/webview
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Build and verify plugin
        run: ./gradlew --no-daemon --no-configuration-cache test verifyPluginProjectConfiguration verifyPluginStructure buildPlugin

      - name: Upload plugin ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: daml-canton-jetbrains-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: build/distributions/*.zip
          body_path: CHANGELOG.md
