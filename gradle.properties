pluginGroup = com.moonsonglabs.daml
pluginVersion = 0.4.0
pluginName = DAML
pluginRepositoryUrl = https://github.com/Moonsong-Labs/daml-canton-jetbrains

# GoLand target: the plugin uses the IntelliJ Platform native LSP API.
platformType = GO
platformVersion = 2026.1.2

# 261 = 2026.1; native platform LSP APIs are required.
pluginSinceBuild = 261

# JDK 21 is required by IntelliJ Platform 2025.2+.
javaVersion = 21

# Platform bundles its own Kotlin stdlib; do not ship our own.
kotlin.stdlib.default.dependency = false

# Faster Gradle.
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx4g -XX:+UseG1GC
